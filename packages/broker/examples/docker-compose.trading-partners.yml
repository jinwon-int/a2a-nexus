version: "3.9"

services:
  a2a-broker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        A2A_BROKER_REVISION: ${A2A_BROKER_REVISION:?set A2A_BROKER_REVISION=$(git rev-parse HEAD)}
        A2A_BROKER_VERSION: ${A2A_BROKER_VERSION:-0.1.0}
        A2A_BROKER_CREATED: ${A2A_BROKER_CREATED:?set A2A_BROKER_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)}
    container_name: a2a-broker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      HOST: 127.0.0.1
      PORT: 8787
      SERVICE_NAME: a2a-broker
      PUBLIC_BASE_URL: http://a2a-broker:8787
      STATE_FILE: /var/lib/a2a-broker/state.json
      WORKER_OFFLINE_AFTER_SEC: 90
      RATE_LIMIT_WINDOW_SEC: 60
      RATE_LIMIT_MAX_REQUESTS: 10
      ENFORCE_REQUESTER_IDENTITY: 1
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - broker-artifacts:/artifacts
      - broker-state:/var/lib/a2a-broker
    networks:
      - a2a-net

  workergamma-worker:
    image: node:22-bookworm-slim
    container_name: workergamma-worker
    restart: unless-stopped
    working_dir: /app
    # Placeholder only. Replace with the real worker startup command before using this in an operator flow.
    command: ["bash", "-lc", "echo workergamma worker placeholder && tail -f /dev/null"]
    environment:
      NODE_ID: workergamma
      NODE_ROLE: live-trader
      BROKER_URL: http://a2a-broker:8787
      WORKSPACE_ROOT: /workspace/live
      ARTIFACT_ROOT: /artifacts
      CONFIG_ROOT: /config
    volumes:
      # Safe placeholder volumes. Put live host paths in an operator-only override file, not this copyable example.
      - workergamma-workspace:/workspace/live:ro
      - workergamma-config:/config:ro
      - workergamma-artifacts:/artifacts:ro
    depends_on:
      - a2a-broker
    networks:
      - a2a-net

  dengae-worker:
    image: node:22-bookworm-slim
    container_name: dengae-worker
    restart: unless-stopped
    working_dir: /app
    # Placeholder only. Replace with the real worker startup command before using this in an operator flow.
    command: ["bash", "-lc", "echo dengae worker placeholder && tail -f /dev/null"]
    environment:
      NODE_ID: dengae
      NODE_ROLE: researcher
      BROKER_URL: http://a2a-broker:8787
      WORKSPACE_ROOT: /workspace/research
      DATASET_ROOT: /datasets
      ARTIFACT_ROOT: /artifacts
    volumes:
      # Safe placeholder volumes. Put live host paths in an operator-only override file, not this copyable example.
      - dengae-research:/workspace/research:ro
      - dengae-datasets:/datasets:ro
      - dengae-artifacts:/artifacts:ro
    depends_on:
      - a2a-broker
    networks:
      - a2a-net

volumes:
  broker-artifacts:
  broker-state:
  workergamma-workspace:
  workergamma-config:
  workergamma-artifacts:
  dengae-research:
  dengae-datasets:
  dengae-artifacts:

networks:
  a2a-net:
    driver: bridge
