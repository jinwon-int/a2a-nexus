services:
  a2a-broker:
    build:
      context: ../..
      dockerfile: packages/broker/Dockerfile
      args:
        # Pass git SHA and timestamp as build args so Docker labels
        # (org.opencontainers.image.revision) and runtime env vars
        # (A2A_BROKER_REVISION) reflect the deployed commit.
        # Compose expansion is intentionally fail-closed for production provenance.
        #
        # #1766: prefer `npm run build:image -w packages/broker`, which runs
        # scripts/check-build-revision.mjs first and only then invokes
        # `docker compose build`. It sets all three args from verified git
        # facts, so a stale `export A2A_BROKER_REVISION=...` left in the shell
        # can no longer become the image label. Setting the vars by hand still
        # works but is unverified: A2A_BROKER_REVISION_VERIFIED stays false and
        # the image records that it was never checked against its own source.
        A2A_BROKER_REVISION: ${A2A_BROKER_REVISION:?set A2A_BROKER_REVISION to the git SHA being built, or run npm run build:image -w packages/broker}
        A2A_BROKER_VERSION: ${A2A_BROKER_VERSION:-0.1.0}
        A2A_BROKER_CREATED: ${A2A_BROKER_CREATED:?set A2A_BROKER_CREATED to an RFC3339/UTC build timestamp}
        A2A_BROKER_REVISION_VERIFIED: ${A2A_BROKER_REVISION_VERIFIED:-false}
        # #1774: stable per-host naming label for image.tag (`vps7-github`,
        # `github`, …). Set it once in .env; the sha half is derived from the
        # verified revision, so the tag tracks the build with no per-deploy
        # edit. Leave unset to bake the short revision alone.
        A2A_BROKER_IMAGE_TAG_PREFIX: ${A2A_BROKER_IMAGE_TAG_PREFIX:-}
    container_name: ${SERVICE_NAME:-a2a-broker}
    hostname: ${SERVICE_NAME:-a2a-broker}
    restart: unless-stopped
    # NOTE (#1772): `env_file` injects this whole file over the image's own ENV.
    # A2A_BROKER_REVISION / _BUILT_AT / _IMAGE_TAG / _CREATED in `.env` are
    # therefore *build-time interpolation inputs only* — they no longer shape
    # what the broker reports. The runtime reads provenance from the
    # `dist/build-info.json` baked into the image, and a host value that
    # contradicts it is ignored and surfaced as a /health warning.
    #
    # MIGRATION (#1774): `image.tag` is now baked too. Replace the per-deploy
    # `A2A_BROKER_IMAGE_TAG=<prefix>-<sha>` line in `.env` with a one-time
    # `A2A_BROKER_IMAGE_TAG_PREFIX=<prefix>`. Until you do, the stale
    # A2A_BROKER_IMAGE_TAG is ignored and reported as a provenance conflict on
    # /health — the warning names the value to remove.
    #
    # Before that fix a single stale line here made /health advertise a commit
    # the image was never built from: a month on T2, and a three-way
    # label/revision/tag disagreement on the T1 production broker. Verify a
    # deployment with `node scripts/check-deployed-provenance.mjs --container
    # <name>`, which compares the image label, the container env and /health.
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Host-path default remains compatible with existing deployments. For
      # non-root containers, ensure the host directory is writable by UID/GID
      # 1000 or set A2A_BROKER_STATE_DIR to a pre-owned directory.
      - ${A2A_BROKER_STATE_DIR:-/var/lib/a2a-broker}:/var/lib/a2a-broker
    networks:
      - a2a
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  a2a:
    name: ${SERVICE_NAME:-a2a-broker}-net
