# A2A Docker Runner — Release Gate
#
# Run all validation gates and, only when dry_run=false AND the
# environment approval gate is granted, create a release tag.
#
# 🔒 SAFETY GATE
#   Non-dry-run tag creation is gated behind the `release` environment.
#   GitHub Environments require explicit manual approval by a repo
#   maintainer before the `tag` job runs.  Dry-run (default true) runs
#   all validation and preserves evidence but never touches tags.
#
# 📋 DRY-RUN EVIDENCE
#   The `gate` job always runs and preserves its pass/fail output.
#   Dry-run tag evidence is written as a job summary so CI logs can be
#   linked from the release checklist (#479).
#
# 🚫 SAFETY BOUNDARY
#   This workflow does not:
#     - deploy or restart Gateway/broker/worker services
#     - publish npm packages or Docker images
#     - mutate production databases
#     - send live provider/Telegram messages
#     - ACK terminal outbox records
#     - rotate/disclose secrets
#     - rewrite Git history or force-push
#     - change repository visibility
#
#   Those actions require separate explicit operator approval per
#   docs/release/public-release-provenance-checklist.md.
#
# See also:
#   - https://github.com/jinwon-int/a2a-plane/issues/485
#   - https://github.com/jinwon-int/a2a-plane/issues/479
#   - docs/release/public-release-provenance-checklist.md

name: release-gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to tag (e.g. 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Run gates without creating tag"
        required: false
        default: true
        type: boolean

jobs:
  # ── Gate: validation always runs ──────────────────────────────────
  gate:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.gate-status.outputs.status }}
      version: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/docker-runner/package-lock.json

      - name: Install
        run: npm ci
        working-directory: packages/docker-runner

      - name: Type-check
        run: npm run check
        working-directory: packages/docker-runner

      - name: Build
        run: npm run build
        working-directory: packages/docker-runner

      - name: Lint
        run: npm run lint
        working-directory: packages/docker-runner

      - name: Unit tests
        run: npm test
        working-directory: packages/docker-runner

      - name: Chaos E2E gate (mock)
        run: npm run chaos:e2e
        working-directory: packages/docker-runner

      - name: Tag command validation (dry-run)
        id: tag-dryrun
        run: |
          echo "## Release gate: dry-run tag simulation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Input | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ inputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry-run | ${{ inputs.dry_run }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ref | ${{ github.ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tag candidate: docker-runner-v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "All validation gates passed. Dry-run mode — no tag was created." >> $GITHUB_STEP_SUMMARY

      - name: Set gate status
        id: gate-status
        run: echo "status=passed" >> "$GITHUB_OUTPUT"

  # ── Tag: requires environment approval for non-dry-run ────────────
  tag:
    if: ${{ inputs.dry_run == false && needs.gate.result == 'success' }}
    needs: [gate]
    environment:
      name: release
      url: https://github.com/jinwon-int/a2a-plane/releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release tag
        run: |
          TAG="docker-runner-v${{ inputs.version }}"
          git tag -a "$TAG" -m "CI gate capsule pass for ${{ inputs.version }}"
          echo "## Release tag created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ inputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "Note: The tag was created but not pushed. A separate explicit push or release action is required." >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag evidence summary
        run: |
          echo "## Release gate: non-dry-run completion" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version ${{ inputs.version }} tag created after manual approval through \`release\` environment gate." >> $GITHUB_STEP_SUMMARY
