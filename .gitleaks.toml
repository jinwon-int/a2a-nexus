[extend]
useDefault = true

[[allowlists]]
description = "Allow exact redaction placeholder secret values"
regexTarget = "secret"
regexes = [
  '''^REDACTED$'''
]

[[allowlists]]
description = "Allow synthetic test/build fixture paths"
paths = [
  '''(^|/)dist/''',
  '''\.test\.(ts|js|mjs)$''',
  '''(^|/)tests/'''
]
