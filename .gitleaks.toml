[extend]
useDefault = true

[[allowlists]]
description = "Allow exact redaction placeholder secret values"
regexTarget = "secret"
regexes = [
  '''^REDACTED$'''
]

[[allowlists]]
description = "Allow synthetic test/build fixture paths"
paths = [
  '''(^|/)dist/''',
  '''\.test\.(ts|js|mjs)$''',
  '''(^|/)tests/'''
]

[[allowlists]]
description = "Known false positives: SCREAMING_SNAKE status/enum string literals and code-label constants flagged by generic-api-key entropy (e.g. S1_PRECONDITION, grantEvidenceAccepted=), not credentials"
regexTarget = "secret"
regexes = [
  '''^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+$''',
  '''^grantEvidenceAccepted=$'''
]

[[allowlists]]
description = "Documentation example placeholders (non-secret illustrative tokens in API/spec drafts)"
paths = [
  '''(^|/)docs/.*\.md$'''
]
