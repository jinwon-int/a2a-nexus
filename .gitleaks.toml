[extend]
useDefault = true

# NOTE (#1928): do NOT add a [[allowlists]] paths block here. The gate's
# pass/fail decision never consults path entries in this file — gitleaks runs
# with --redact and the exit decision filters findings in
# scripts/external-secret-scan.mjs via EXACT_SYNTHETIC_FIXTURE_FILES.
# Exact synthetic-fixture path allowlisting lives there and only there;
# scripts/ci-docs-safety.test.mjs fails if a paths block reappears here.

[[allowlists]]
description = "Allow exact redaction placeholder secret values"
regexTarget = "secret"
regexes = [
  '''^REDACTED$'''
]

[[allowlists]]
description = "Known false positives: scenario/status string-literal constants flagged by generic-api-key entropy (wake-proof scenario codes like S1_PRECONDITION, and the grantEvidenceAccepted= label), not credentials. Kept narrow on purpose — do not broaden to all uppercase-underscore strings."
regexTarget = "secret"
regexes = [
  '''^S[0-9]+_[A-Z0-9]+(?:_[A-Z0-9]+)*$''',
  '''^grantEvidenceAccepted=$'''
]
