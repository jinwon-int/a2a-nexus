version: 2
updates:
  # Keep GitHub Actions versions current through reviewed PRs instead of letting
  # mutable tags drift. Dependabot maintains SHA-pinned actions (e.g.
  # dorny/paths-filter) and their version comments, and surfaces bumps for the
  # first-party actions/* still referenced by tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
  # Keep Dockerfile base images reproducible and current (#2257 B6). Every
  # external FROM is pinned as tag@sha256 index digest, so builds are
  # reproducible and Dependabot surfaces digest refreshes (security patches of
  # the same tag) as reviewed PRs. Dependabot reads every file whose name
  # contains "dockerfile" in the listed directories. Node majors follow the
  # runtime-major alignment policy (#1414) and never arrive as grouped bumps.
  - package-ecosystem: docker
    directories:
      - /packages/broker
      - /packages/docker-runner/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      docker-base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  # Keep npm workspace dependencies visible through reviewed PRs. Minor/patch
  # updates are grouped to reduce noise; major updates stay separate.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      npm-major:
        update-types:
          - major
    ignore:
      # Runtime-major alignment policy (#1414): @types/node is pinned to the
      # deployed Node runtime major (node:22-alpine across broker and fleet) —
      # types for a newer runtime admit APIs that do not exist at runtime.
      # TypeScript majors need a deliberate migration lane with a full release
      # gate. Both land through planned toolchain issues, never through
      # grouped major bumps.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
