# A2A Nexus monorepo CI
#
# Path-filtered jobs ensure each package and docs-only changes are validated
# independently, while the full check job runs the complete release gate on
# main and for cross-cutting changes.
#
# a2a-plane (internal tracker, private)actions

name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Pin the secret scanner to a reviewed release instead of @latest so a new
  # gitleaks release can't silently change the readiness gate. Centralized here
  # so every job stays in sync; bump deliberately (mirrors the pinned external
  # source pattern in tck-measurement.yml).
  GITLEAKS_VERSION: v8.30.1

jobs:
  # ── Detect changed paths ────────────────────────────────────────────
  paths-filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      broker: ${{ steps.filter.outputs.broker }}
      docker-runner: ${{ steps.filter.outputs.docker-runner }}
      plugin: ${{ steps.filter.outputs.plugin }}
      contracts: ${{ steps.filter.outputs.contracts }}
      docs: ${{ steps.filter.outputs.docs }}
      scripts: ${{ steps.filter.outputs.scripts }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            broker:
              - 'packages/broker/**'
            docker-runner:
              - 'packages/docker-runner/**'
            plugin:
              - 'packages/openclaw-plugin-a2a/**'
            contracts:
              - 'contracts/**'
              - 'fixtures/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'SECURITY.md'
              - 'SUPPORT.md'
              - 'CONTRIBUTING.md'
              - 'CODE_OF_CONDUCT.md'
              - 'CHANGELOG.md'
              - 'GOVERNANCE.md'
            scripts:
              - 'scripts/**'
              - 'scanner/**'
            root:
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.gitleaks.toml'

  # ── Setup and dependency installation ───────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.npm-cache.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - id: npm-cache
        run: echo "cache-key=${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - run: npm ci --include=dev

  # ── Monorepo layout and package metadata checks ────────────────────
  layout:
    needs: [setup, paths-filter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v6
        with:
          path: packages/*/dist
          key: tsbuild-all-${{ runner.os }}-${{ hashFiles('packages/**/*.ts', 'packages/**/tsconfig.json') }}
      - run: npm ci --include=dev
      - run: npm run check:layout
      - run: npm run check:packages

  # ── Broker package (API, lifecycle, evidence bridge) ────────────────
  broker:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs.broker == 'true' || needs.paths-filter.outputs.contracts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v6
        with:
          path: packages/broker/dist
          key: tsbuild-broker-${{ runner.os }}-${{ hashFiles('packages/broker/**/*.ts', 'packages/broker/tsconfig.json') }}
      - run: npm ci --include=dev
      - run: node scripts/run-monorepo-package-ci-parity.mjs broker
      - name: a2a-inspector bridge artifact
        run: |
          mkdir -p artifacts/a2a-inspector
          node packages/broker/scripts/conformance-inspector.mjs \
            --agent-card fixtures/conformance/agent-cards/a2a-nexus-broker.json \
            --out artifacts/a2a-inspector/bridge.json
      - name: Upload a2a-inspector bridge artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a2a-inspector-bridge
          path: artifacts/a2a-inspector/bridge.json

  # ── Docker runner package (isolated execution, evidence) ────────────
  docker-runner:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs.docker-runner == 'true' || needs.paths-filter.outputs.contracts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v6
        with:
          path: packages/docker-runner/dist
          key: tsbuild-docker-runner-${{ runner.os }}-${{ hashFiles('packages/docker-runner/**/*.ts', 'packages/docker-runner/tsconfig.json') }}
      - run: npm ci --include=dev
      - run: node scripts/run-monorepo-package-ci-parity.mjs docker-runner

  # ── OpenClaw plugin package (broker adapter, Gateway hooks) ────────
  plugin:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs.plugin == 'true' || needs.paths-filter.outputs.contracts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v6
        with:
          path: packages/openclaw-plugin-a2a/dist
          key: tsbuild-plugin-${{ runner.os }}-${{ hashFiles('packages/openclaw-plugin-a2a/**/*.ts', 'packages/openclaw-plugin-a2a/tsconfig.json') }}
      - run: npm ci --include=dev
      - run: node scripts/run-monorepo-package-ci-parity.mjs openclaw-plugin-a2a

  # ── Contract conformance and fixtures ────────────────────────────────
  contracts:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs.contracts == 'true' || needs.paths-filter.outputs.scripts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
      - run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm ci --include=dev
      - run: npm run test:conformance
      - run: npm run scan:external-secrets
      - run: npm run check:approval-records
      - run: npm run check:compatibility-baselines

  # ── Docs-only validation (no code build required) ───────────────────
  docs:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs.docs == 'true' && needs.paths-filter.outputs.broker != 'true' && needs.paths-filter.outputs.docker-runner != 'true' && needs.paths-filter.outputs.plugin != 'true' && needs.paths-filter.outputs.contracts != 'true' && needs.paths-filter.outputs.scripts != 'true' && needs.paths-filter.outputs.root != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
      - run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm ci --include=dev
      - run: npm run check:layout
      - run: npm run check:markdown-links
      - run: npm run scan:external-secrets
      - run: echo "docs-only change — code build/smoke skipped"

  # ── Promotion-ready quickstart capstone (no-live 5-minute path) ─────
  promotion-capstone:
    needs: [setup, paths-filter]
    if: ${{ github.ref == 'refs/heads/main' || needs.paths-filter.outputs.docs == 'true' || needs.paths-filter.outputs.scripts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check:promotion-capstone
      - run: npm run smoke:quickstart

  # ── Full release gate (main branch and cross-cutting changes) ───────
  check:
    if: ${{ github.ref == 'refs/heads/main' || needs.paths-filter.outputs.scripts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    needs: [setup, paths-filter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
      - run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: packages/*/dist
          key: tsbuild-all-${{ runner.os }}-${{ hashFiles('packages/**/*.ts', 'packages/**/tsconfig.json') }}
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm run check:quickstart-conformance
      - run: npm run check:external-harness-conformance
      - run: npm run test:release-gate
