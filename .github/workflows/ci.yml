# A2A Nexus monorepo CI
#
# Path-filtered jobs ensure each package and docs-only changes are validated
# independently, while the full check job runs the complete release gate on
# main and for cross-cutting changes.
#
# a2a-plane (internal tracker, private)actions

name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Least-privilege default for GITHUB_TOKEN (#1228 L1): every job only reads
# the repository unless it widens its own job-level scope (paths-filter adds
# pull-requests: read). Enforced by scripts/check-workflow-permissions.mjs.
permissions:
  contents: read

env:
  # Pin the secret scanner to a reviewed release instead of @latest so a new
  # gitleaks release can't silently change the readiness gate. Centralized here
  # so every job stays in sync; bump deliberately (mirrors the pinned external
  # source pattern in tck-measurement.yml).
  GITLEAKS_VERSION: v8.30.1
  # Promote internal-node-identifier findings from warn to fail in CI now that
  # live public surfaces are clean (#1193 PR 4). Allowlisted historical/evidence
  # paths stay warn-only and remain bounded by the baseline ratchet.
  PUBLIC_READINESS_STRICT_INTERNAL: '1'

jobs:
  # ── Detect changed paths ────────────────────────────────────────────
  paths-filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      broker: ${{ steps.filter.outputs.broker }}
      docker-runner: ${{ steps.filter.outputs.docker-runner }}
      policy-referee: ${{ steps.filter.outputs.policy-referee }}
      attestation: ${{ steps.filter.outputs.attestation }}
      nclex-evaluation: ${{ steps.filter.outputs.nclex-evaluation }}
      contracts: ${{ steps.filter.outputs.contracts }}
      docs: ${{ steps.filter.outputs.docs }}
      scripts: ${{ steps.filter.outputs.scripts }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            broker:
              - 'packages/broker/**'
            docker-runner:
              - 'packages/docker-runner/**'
            policy-referee:
              - 'packages/policy-referee/**'
            attestation:
              - 'packages/attestation/**'
            nclex-evaluation:
              - 'packages/nclex-evaluation/**'
            contracts:
              - 'contracts/**'
              - 'fixtures/**'
              - 'test/conformance/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'SECURITY.md'
              - 'SUPPORT.md'
              - 'CONTRIBUTING.md'
              - 'CODE_OF_CONDUCT.md'
              - 'CHANGELOG.md'
              - 'GOVERNANCE.md'
            scripts:
              - 'scripts/**'
              - 'scanner/**'
            root:
              - 'package.json'
              - 'package-lock.json'
              # All of .github, not just workflows: the public-readiness scan in
              # the check job scans .github file content (e.g. CODEOWNERS), so a
              # .github-only change must not skip the job that scans it. PR
              # #1759 changed only .github/CODEOWNERS, skipped check, and landed
              # a strict-mode scan failure on main (found 2026-08-08).
              - '.github/**'
              - '.gitleaks.toml'

  # ── Setup and dependency installation ───────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.npm-cache.outputs.cache-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-deps
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - id: npm-cache
        run: echo "cache-key=node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - run: npm ci --include=dev
        if: steps.npm-deps.outputs.cache-hit != 'true'

  # ── Monorepo layout and package metadata checks ────────────────────
  layout:
    needs: [setup, paths-filter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-deps
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/*/dist
          key: tsbuild-all-${{ runner.os }}-${{ hashFiles('packages/**/*.ts', 'packages/**/tsconfig.json') }}
      - run: npm ci --include=dev
        if: steps.npm-deps.outputs.cache-hit != 'true'
      - run: npm run check:layout
      - run: npm run check:packages

  # ── Broker package (API, lifecycle, evidence bridge) ────────────────
  broker:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs.broker == 'true' || needs.paths-filter.outputs['policy-referee'] == 'true' || needs.paths-filter.outputs.attestation == 'true' || needs.paths-filter.outputs['nclex-evaluation'] == 'true' || needs.paths-filter.outputs.contracts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-deps
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/broker/dist
          key: tsbuild-broker-${{ runner.os }}-${{ hashFiles('packages/broker/**/*.ts', 'packages/broker/tsconfig.json') }}
      - run: npm ci --include=dev
        if: steps.npm-deps.outputs.cache-hit != 'true'
      - run: node scripts/run-monorepo-package-ci-parity.mjs broker
      - name: a2a-inspector bridge artifact
        run: |
          mkdir -p artifacts/a2a-inspector
          node packages/broker/scripts/conformance-inspector.mjs \
            --agent-card fixtures/conformance/agent-cards/a2a-nexus-broker.json \
            --out artifacts/a2a-inspector/bridge.json
      - name: Upload a2a-inspector bridge artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a2a-inspector-bridge
          path: artifacts/a2a-inspector/bridge.json

  # ── Docker runner package (isolated execution, evidence) ────────────
  docker-runner:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs.docker-runner == 'true' || needs.paths-filter.outputs.contracts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-deps
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/docker-runner/dist
          key: tsbuild-docker-runner-${{ runner.os }}-${{ hashFiles('packages/docker-runner/**/*.ts', 'packages/docker-runner/tsconfig.json') }}
      - run: npm ci --include=dev
        if: steps.npm-deps.outputs.cache-hit != 'true'
      - run: node scripts/run-monorepo-package-ci-parity.mjs docker-runner

  # ── Attestation package (agent work attestation toolkit, #1601 P2) ────
  attestation:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs.attestation == 'true' || needs.paths-filter.outputs.contracts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-deps
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/attestation/dist
          key: tsbuild-attestation-${{ runner.os }}-${{ hashFiles('packages/attestation/**/*.ts', 'packages/attestation/tsconfig.json') }}
      - run: npm ci --include=dev
        if: steps.npm-deps.outputs.cache-hit != 'true'
      - run: node scripts/run-monorepo-package-ci-parity.mjs attestation

  # ── NCLEX evaluation package (receipt domain, #1601 first slice) ────
  nclex-evaluation:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs['nclex-evaluation'] == 'true' || needs.paths-filter.outputs.contracts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-deps
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/nclex-evaluation/dist
          key: tsbuild-nclex-evaluation-${{ runner.os }}-${{ hashFiles('packages/nclex-evaluation/**/*.ts', 'packages/nclex-evaluation/tsconfig.json') }}
      - run: npm ci --include=dev
        if: steps.npm-deps.outputs.cache-hit != 'true'
      - run: node scripts/run-monorepo-package-ci-parity.mjs nclex-evaluation

  # ── Policy referee package (worker-class policy engine, #1601 P1) ────
  policy-referee:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs['policy-referee'] == 'true' || needs.paths-filter.outputs.contracts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-deps
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/policy-referee/dist
          key: tsbuild-policy-referee-${{ runner.os }}-${{ hashFiles('packages/policy-referee/**/*.ts', 'packages/policy-referee/tsconfig.json') }}
      - run: npm ci --include=dev
        if: steps.npm-deps.outputs.cache-hit != 'true'
      - run: node scripts/run-monorepo-package-ci-parity.mjs policy-referee

  # ── Contract conformance and fixtures ────────────────────────────────
  contracts:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs.contracts == 'true' || needs.paths-filter.outputs.scripts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-deps
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: gitleaks-bin
        with:
          path: ~/go/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ env.GITLEAKS_VERSION }}
      - run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
        if: steps.gitleaks-bin.outputs.cache-hit != 'true'
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm ci --include=dev
        if: steps.npm-deps.outputs.cache-hit != 'true'
      - run: npm run test:conformance
      - run: npm run scan:external-secrets
      - run: npm run check:approval-records
      - run: npm run check:compatibility-baselines

  # ── Docs-only validation (no code build required) ───────────────────
  docs:
    needs: [setup, paths-filter]
    if: ${{ needs.paths-filter.outputs.docs == 'true' && needs.paths-filter.outputs.broker != 'true' && needs.paths-filter.outputs.docker-runner != 'true' && needs.paths-filter.outputs.contracts != 'true' && needs.paths-filter.outputs.scripts != 'true' && needs.paths-filter.outputs.root != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-deps
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: gitleaks-bin
        with:
          path: ~/go/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ env.GITLEAKS_VERSION }}
      - run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
        if: steps.gitleaks-bin.outputs.cache-hit != 'true'
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm ci --include=dev
        if: steps.npm-deps.outputs.cache-hit != 'true'
      - run: npm run check:layout
      - run: npm run check:markdown-links
      - run: npm run scan:external-secrets
      - run: echo "docs-only change — code build/smoke skipped"

  # ── Promotion-ready quickstart capstone (no-live 5-minute path) ─────
  promotion-capstone:
    needs: [setup, paths-filter]
    if: ${{ github.ref == 'refs/heads/main' || needs.paths-filter.outputs.docs == 'true' || needs.paths-filter.outputs.scripts == 'true' || needs.paths-filter.outputs.root == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-deps
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - run: npm ci --include=dev
        if: steps.npm-deps.outputs.cache-hit != 'true'
      - run: npm run smoke:quickstart

  # ── Full release gate (always; its inputs are the whole repo) ───────
  #
  # This job used to be path-filtered to scripts/**, scanner/**, package.json,
  # .github/** and .gitleaks.toml. That filter was unsound, because the release
  # gate it runs does not read only those paths:
  #
  #   - scripts/check-script-budget.mjs counts packages/broker/package.json
  #     scripts and packages/broker/src/core modules;
  #   - scripts/public-readiness-scan.mjs walks the entire tree, so docs/ and
  #     packages/ content can trip it;
  #   - scripts/check-markdown-links.mjs resolves links across all .md.
  #
  # So a PR touching only a non-filtered path skipped the one job that could
  # catch its failure, merged clean, and turned main red on the push trigger.
  # That happened twice in two days:
  #
  #   - #1759 (.github/CODEOWNERS only) landed a strict-mode public-readiness
  #     failure. The fix was to add '.github/**' to the filter — patching the
  #     symptom, leaving the filter unsound.
  #   - #1773 (packages/broker/** only) then landed three failures the same
  #     way: script-budget 56>55, release-gate-inventory 56!==55, and
  #     public-readiness internal-node-identifier.
  #
  # Enumerating more paths cannot fix this; the gate's input set is the repo.
  # The job costs ~1 minute, so it now always runs and the filter is gone.
  # paths-filter stays a dependency only to keep job ordering stable.
  check:
    needs: [setup, paths-filter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: npm-deps
        with:
          path: node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: gitleaks-bin
        with:
          path: ~/go/bin/gitleaks
          key: gitleaks-${{ runner.os }}-${{ env.GITLEAKS_VERSION }}
      - run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
        if: steps.gitleaks-bin.outputs.cache-hit != 'true'
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/*/dist
          key: tsbuild-all-${{ runner.os }}-${{ hashFiles('packages/**/*.ts', 'packages/**/tsconfig.json') }}
      - run: npm ci --include=dev
        if: steps.npm-deps.outputs.cache-hit != 'true'
      - run: npm run check
      - run: npm run check:quickstart-conformance
      - run: npm run test:release-gate
