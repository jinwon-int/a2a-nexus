# Weekly closeout hygiene monitor (#1210, #1220).
#
# Three read-only checks: (1) issues closed as "completed" while their
# body task-list still has unchecked items — the finalizer reconciliation rule
# in docs/operators.md had no enforcement and was violated twice (#1204,
# #1198); (2) disposition comments whose citations (PRs, workflow runs, repo
# paths) do not exist — a reconciliation that points at nothing is not a
# reconciliation; (3) decision.dialectic hygiene reports expired non-terminal
# dialectics without mutating broker state (#1295). The job never mutates issue
# or dialectic state; violations fail the run so they surface in Actions.
# Exceptions require the closeout-exception label plus an item-by-item
# disposition comment.

name: closeout-hygiene
on:
  schedule:
    - cron: '17 1 * * 1' # Mondays 01:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  closeout-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
      - run: node scripts/check-issue-closeout-hygiene.mjs --days 14
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/check-disposition-references.mjs --days 14
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/check-dialectic-hygiene.mjs
        if: always()
