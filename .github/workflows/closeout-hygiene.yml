# Weekly closeout hygiene monitor (#1210, #1220).
#
# Two paired read-only checks: (1) issues closed as "completed" while their
# body task-list still has unchecked items — the finalizer reconciliation rule
# in docs/operators.md had no enforcement and was violated twice (#1204,
# #1198); (2) disposition comments whose citations (PRs, workflow runs, repo
# paths) do not exist — a reconciliation that points at nothing is not a
# reconciliation. The job never mutates issue state; violations fail the run
# so they surface in the Actions tab. Exceptions require the
# closeout-exception label plus an item-by-item disposition comment.

name: closeout-hygiene
on:
  schedule:
    - cron: '17 1 * * 1' # Mondays 01:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  closeout-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - run: node scripts/check-issue-closeout-hygiene.mjs --days 14
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/check-disposition-references.mjs --days 14
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
