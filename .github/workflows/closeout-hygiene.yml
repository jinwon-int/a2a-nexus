# Weekly closeout hygiene monitor (#1210).
#
# Detects issues closed as "completed" while their body task-list still has
# unchecked items — the finalizer reconciliation rule in docs/operators.md had
# no enforcement and was violated twice (#1204, #1198). Read-only: the job
# never mutates issue state; violations fail the run so they surface in the
# Actions tab. Exceptions require the closeout-exception label plus an
# item-by-item disposition comment.

name: closeout-hygiene
on:
  schedule:
    - cron: '17 1 * * 1' # Mondays 01:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  closeout-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/check-issue-closeout-hygiene.mjs --days 14
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
