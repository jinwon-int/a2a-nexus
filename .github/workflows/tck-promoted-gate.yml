# Promoted-category A2A TCK PR gate
#
# This is intentionally narrower than tck-measurement.yml: it runs only TCK
# categories that have documented stable-green evidence in the broker runbook.
# The weekly measurement lane remains non-gating and tracks the full trend.
#
# Merge-blocking (a2a-nexus#1500 follow-up, 2026-08-15): the promoted
# categories' job names are required status checks in the main ruleset. That
# is why this workflow triggers on every pull request and gates the TCK jobs
# with an intra-workflow `changes` filter instead of a workflow-level `paths`
# filter: a paths-filtered workflow never reports on non-matching PRs, which
# would deadlock every PR whose required checks can never run. Skipped jobs
# report conclusion `skipped`, which satisfies required checks — the same
# contract `ci.yml` already uses for its path-aware package jobs.

name: tck-promoted-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tck-promoted-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tck: ${{ steps.filter.outputs.tck }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            tck:
              - 'packages/broker/src/a2a/**'
              - 'packages/broker/src/fixtures/a2a-protocol-compatibility.ts'
              - 'packages/broker/src/server.ts'
              - 'packages/broker/scripts/a2a-tck-harness*.mjs'
              - 'packages/broker/scripts/append-tck-history.mjs'
              - 'packages/broker/scripts/check-tck-regressions.mjs'
              - 'packages/broker/scripts/project-tck-readiness.mjs'
              - 'packages/broker/scripts/project-tck-readiness.test.mjs'
              - 'packages/broker/docs/a2a-tck-runbook.md'
              - 'packages/broker/docs/tck-failing-categories.json'
              - 'packages/broker/docs/tck-history.json'
              - 'packages/broker/package.json'
              - 'docs/release-readiness.md'
              - '.github/workflows/tck-promoted-gate.yml'

  readiness-projection:
    name: TCK readiness projection is current
    needs: [changes]
    if: ${{ needs.changes.outputs.tck == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Reject stale release-readiness TCK results
        run: node packages/broker/scripts/project-tck-readiness.mjs --check

      - name: Test the deterministic projection and stale-output guard
        run: node --test packages/broker/scripts/project-tck-readiness.test.mjs

  agent-card:
    name: promoted TCK category — agent_card
    needs: [changes]
    if: ${{ needs.changes.outputs.tck == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node + Python + the pinned official TCK (same reviewed pin as
      # tck-measurement.yml; bump it in the composite action, which is now the
      # single place all six promoted-category jobs read it from).
      - uses: ./.github/actions/tck-promoted-setup

      - name: Run promoted agent_card TCK category
        working-directory: packages/broker
        env:
          A2A_TCK_DIR: /tmp/a2a-tck
        run: |
          set -euo pipefail
          export PATH="/tmp/a2a-tck/.venv/bin:$PATH"
          npm run tck:run -- --level must --transport jsonrpc -- \
            --ignore=tests/compatibility/core_operations \
            --ignore=tests/compatibility/grpc \
            --ignore=tests/compatibility/http_json \
            --ignore=tests/compatibility/jsonrpc \
            -q | tee /tmp/tck-promoted-agent-card.log

      - name: Upload promoted-gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tck-promoted-agent-card-log
          path: /tmp/tck-promoted-agent-card.log
          if-no-files-found: warn
          retention-days: 30

  version-negotiation:
    name: promoted TCK sub-category — version negotiation
    needs: [changes]
    if: ${{ needs.changes.outputs.tck == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/tck-promoted-setup

      - name: Run promoted version-negotiation TCK sub-category
        working-directory: packages/broker
        env:
          A2A_TCK_DIR: /tmp/a2a-tck
        run: |
          set -euo pipefail
          export PATH="/tmp/a2a-tck/.venv/bin:$PATH"
          npm run tck:run -- --level must --transport jsonrpc -- \
            -k 'test_unsupported_version_returns_error_jsonrpc or test_empty_version_treated_as_default_jsonrpc or test_version_not_supported_error or test_error_code_in_valid_range' \
            --deselect='tests/compatibility/jsonrpc/test_error_codes.py::TestJsonRpcErrorCodeRange::test_error_code_in_valid_range[GetTask-nonexistent]' \
            --deselect='tests/compatibility/jsonrpc/test_error_codes.py::TestJsonRpcErrorCodeRange::test_error_code_in_valid_range[CancelTask-nonexistent]' \
            -q | tee /tmp/tck-promoted-version-negotiation.log

      - name: Upload promoted-gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tck-promoted-version-negotiation-log
          path: /tmp/tck-promoted-version-negotiation.log
          if-no-files-found: warn
          retention-days: 30

  artifact-message-projection:
    name: promoted TCK sub-category — artifact/message projection
    needs: [changes]
    if: ${{ needs.changes.outputs.tck == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/tck-promoted-setup

      - name: Run promoted artifact/message-projection TCK sub-category
        working-directory: packages/broker
        env:
          A2A_TCK_DIR: /tmp/a2a-tck
        run: |
          set -euo pipefail
          export PATH="/tmp/a2a-tck/.venv/bin:$PATH"
          npm run tck:run -- --level must --transport jsonrpc -- \
            -k 'test_task_has_text_artifact or test_task_has_file_artifact or test_task_has_file_url_artifact or test_task_has_data_artifact or test_returns_message_with_text_part or test_response_validates_against_schema or test_no_snake_case_keys or test_enum_values_are_strings or test_timestamps_are_iso8601_utc' \
            -q | tee /tmp/tck-promoted-artifact-message-projection.log

      - name: Upload promoted-gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tck-promoted-artifact-message-projection-log
          path: /tmp/tck-promoted-artifact-message-projection.log
          if-no-files-found: warn
          retention-days: 30

  error-codes-and-errorinfo:
    name: promoted TCK sub-category — error codes and ErrorInfo
    needs: [changes]
    if: ${{ needs.changes.outputs.tck == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/tck-promoted-setup

      - name: Run promoted error-codes/ErrorInfo TCK sub-category
        working-directory: packages/broker
        env:
          A2A_TCK_DIR: /tmp/a2a-tck
        run: |
          set -euo pipefail
          export PATH="/tmp/a2a-tck/.venv/bin:$PATH"
          # 12 runnable selectors of 13: test_unsupported_operation_error is
          # capability-unreachable (TCK skips it whenever the agent declares
          # streaming — see capabilityExcludedSelectors in
          # packages/broker/docs/tck-failing-categories.json).
          npm run tck:run -- --level must --transport jsonrpc -- \
            -k 'test_error_has_code_and_message_jsonrpc or test_error_object_structure or test_a2a_error_codes_in_range or test_error_data_contains_error_info or test_task_not_cancelable_error or test_push_notification_not_supported_error or test_content_type_not_supported_error or test_error_code_in_valid_range or test_error_data_is_array or test_data_contains_error_info or test_error_info_valid or test_error_info_reason_matches_condition' \
            --deselect='tests/compatibility/jsonrpc/test_error_codes.py::TestJsonRpcErrorCodeRange::test_error_code_in_valid_range[GetTask-nonexistent]' \
            --deselect='tests/compatibility/jsonrpc/test_error_codes.py::TestJsonRpcErrorCodeRange::test_error_code_in_valid_range[SendMessage-bad-version]' \
            -q | tee /tmp/tck-promoted-error-codes.log

      - name: Upload promoted-gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tck-promoted-error-codes-log
          path: /tmp/tck-promoted-error-codes.log
          if-no-files-found: warn
          retention-days: 30

  task-not-found:
    name: promoted TCK sub-category — task not found / invalid task
    needs: [changes]
    if: ${{ needs.changes.outputs.tck == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/tck-promoted-setup

      - name: Run promoted task-not-found TCK sub-category
        working-directory: packages/broker
        env:
          A2A_TCK_DIR: /tmp/a2a-tck
        run: |
          set -euo pipefail
          export PATH="/tmp/a2a-tck/.venv/bin:$PATH"
          npm run tck:run -- --level must --transport jsonrpc -- \
            -k 'test_a2a_error_type_mappings or test_cancel_terminal_task_returns_error or test_send_message_to_terminal_task or test_reject_mismatching_context or test_task_not_found_error or test_error_code_in_valid_range or test_subscribe_nonexistent_task_returns_error' \
            --deselect='tests/compatibility/jsonrpc/test_error_codes.py::TestJsonRpcErrorCodeRange::test_error_code_in_valid_range[CancelTask-nonexistent]' \
            --deselect='tests/compatibility/jsonrpc/test_error_codes.py::TestJsonRpcErrorCodeRange::test_error_code_in_valid_range[SendMessage-bad-version]' \
            -q | tee /tmp/tck-promoted-task-not-found.log

      - name: Upload promoted-gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tck-promoted-task-not-found-log
          path: /tmp/tck-promoted-task-not-found.log
          if-no-files-found: warn
          retention-days: 30

  streaming-subscribe-ordering:
    name: promoted TCK sub-category — streaming / subscribe ordering
    needs: [changes]
    if: ${{ needs.changes.outputs.tck == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/tck-promoted-setup

      - name: Run promoted streaming/subscribe TCK sub-category
        working-directory: packages/broker
        env:
          A2A_TCK_DIR: /tmp/a2a-tck
        run: |
          set -euo pipefail
          export PATH="/tmp/a2a-tck/.venv/bin:$PATH"
          npm run tck:run -- --level must --transport jsonrpc -- \
            -k 'test_events_broadcast_to_all_streams or test_streams_receive_same_events_in_order or test_closing_one_stream_does_not_affect_others or test_streaming_event_ordering or test_subscribe_terminates_at_terminal_state or test_subscribe_rejects_terminal_task or test_streaming_events_have_jsonrpc_envelope or test_streaming_events_contain_stream_response or test_subscribe_first_event_is_task' \
            -q | tee /tmp/tck-promoted-streaming.log

      - name: Upload promoted-gate log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tck-promoted-streaming-log
          path: /tmp/tck-promoted-streaming.log
          if-no-files-found: warn
          retention-days: 30
