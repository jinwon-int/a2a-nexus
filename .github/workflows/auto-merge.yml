# Merge-readiness report (a2a-nexus#2501, option 2 — owner decision 2026-11-06).
#
# This workflow used to request merge-queue admission with the workflow
# GITHUB_TOKEN. Events performed with that token never start new workflow
# runs, so the queue's merge_group checks never ran and the entry was removed
# as checks_timed_out after 60 minutes (#2500). In the 25 merged PRs before the
# change, every successful admission was made by a person account. The
# workflow therefore no longer enqueues or merges anything. It reports which
# open PRs at the successful CI head are ready, so a person account (or the
# relay helper) can enqueue them with an exact-head admission.
#
# Selection is unchanged and stays conservative:
# - GitHub reports mergeStateStatus == "CLEAN", which is only meaningful when
#   `main` branch protection marks reviews and required checks as required
#   (docs/branch-protection.md);
# - the author is a fleet account or a fleet dependency bot (a2a-nexus#2428):
#   an external fork PR is reported as needing an explicit owner decision.
#   Extend TRUSTED_AUTHORS only by PR.
name: auto-merge

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed

# Read-only: the job lists PRs and writes a notice + job summary.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge-successful-ci-pr:
    name: report merge-ready PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Report open PRs ready for merge-queue admission
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          gh pr list \
            --repo "$REPO" \
            --state open \
            --base main \
            --json number,isDraft,headRefOid,mergeStateStatus,title,url,author \
            > /tmp/open-prs.json

          python3 - <<'PY' > /tmp/auto-merge-prs.txt
          import json
          import os

          import sys

          TRUSTED_AUTHORS = {
              "jinon86",
              "seoseo-ai",
              "app/dependabot",
              "app/jinwon-deps-bot",
              "app/github-actions",
          }
          head_sha = os.environ["HEAD_SHA"]
          with open(os.environ.get("OPEN_PRS_JSON", "/tmp/open-prs.json"), encoding="utf-8") as f:
              prs = json.load(f)

          for pr in prs:
              if pr.get("isDraft"):
                  continue
              if pr.get("headRefOid") != head_sha:
                  continue
              # Only merge PRs GitHub itself reports as ready: CLEAN means
              # required reviews are approved, required checks pass, and there
              # is no conflict. Without this gate the workflow would attempt to
              # merge unreviewed PRs if branch protection were ever relaxed.
              if pr.get("mergeStateStatus") != "CLEAN":
                  continue
              author = ((pr.get("author") or {}).get("login") or "").strip()
              if author not in TRUSTED_AUTHORS:
                  print(f"skip PR #{pr.get('number')}: author {author or '<unknown>'!r} is external; "
                        "needs an explicit owner decision (a2a-nexus#2428)", file=sys.stderr)
                  continue
              number = pr.get("number")
              if number is not None:
                  print(number)
          PY

          if [ ! -s /tmp/auto-merge-prs.txt ]; then
            echo "No open non-draft main PR matched successful CI head ${HEAD_SHA}."
            exit 0
          fi

          while read -r pr; do
            [ -n "$pr" ] || continue
            # No admission here (#2501): a GITHUB_TOKEN enqueue never starts
            # merge_group runs. A person account must enqueue the exact head.
            echo "::notice title=Ready for merge-queue admission::PR #${pr} is CLEAN at CI head ${HEAD_SHA}. Enqueue it with a person account (exact head); a GITHUB_TOKEN enqueue never starts merge_group checks (#2501)."
            {
              echo "### PR #${pr} is ready for merge-queue admission"
              echo
              echo "- Exact head: \`${HEAD_SHA}\`"
              echo "- Enqueue with a person account or the relay helper, bound to this head."
              echo "- This workflow does not enqueue: a \`GITHUB_TOKEN\` admission never starts \`merge_group\` checks (#2501)."
            } >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/auto-merge-prs.txt
