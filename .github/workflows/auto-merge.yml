# Safety invariant: this workflow merges only PRs GitHub reports as
# mergeStateStatus == "CLEAN", which is only meaningful when `main` branch
# protection marks reviews and required checks as required. See
# docs/branch-protection.md for the required ruleset state and how to verify it.
#
# Second invariant (a2a-nexus#2428): only PRs authored by a fleet account or a
# fleet dependency bot are auto-merged. An external fork PR stays open for an
# explicit owner decision even after it is approved and green — on 2026-10-22
# an unaffiliated account's PR to the worker artifact scripts was merged this
# way after a single approval. Extend TRUSTED_AUTHORS only by PR.
name: auto-merge

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge-successful-ci-pr:
    name: merge successful CI PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Merge open PRs matching successful CI head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          gh pr list \
            --repo "$REPO" \
            --state open \
            --base main \
            --json number,isDraft,headRefOid,mergeStateStatus,title,url,author \
            > /tmp/open-prs.json

          python3 - <<'PY' > /tmp/auto-merge-prs.txt
          import json
          import os

          import sys

          TRUSTED_AUTHORS = {
              "jinon86",
              "seoseo-ai",
              "app/dependabot",
              "app/jinwon-deps-bot",
              "app/github-actions",
          }
          head_sha = os.environ["HEAD_SHA"]
          with open(os.environ.get("OPEN_PRS_JSON", "/tmp/open-prs.json"), encoding="utf-8") as f:
              prs = json.load(f)

          for pr in prs:
              if pr.get("isDraft"):
                  continue
              if pr.get("headRefOid") != head_sha:
                  continue
              # Only merge PRs GitHub itself reports as ready: CLEAN means
              # required reviews are approved, required checks pass, and there
              # is no conflict. Without this gate the workflow would attempt to
              # merge unreviewed PRs if branch protection were ever relaxed.
              if pr.get("mergeStateStatus") != "CLEAN":
                  continue
              author = ((pr.get("author") or {}).get("login") or "").strip()
              if author not in TRUSTED_AUTHORS:
                  print(f"skip PR #{pr.get('number')}: author {author or '<unknown>'!r} is external; "
                        "needs an explicit owner decision (a2a-nexus#2428)", file=sys.stderr)
                  continue
              number = pr.get("number")
              if number is not None:
                  print(number)
          PY

          if [ ! -s /tmp/auto-merge-prs.txt ]; then
            echo "No open non-draft main PR matched successful CI head ${HEAD_SHA}."
            exit 0
          fi

          while read -r pr; do
            [ -n "$pr" ] || continue
            echo "Requesting merge/queue admission for PR #${pr}, CI head ${HEAD_SHA}."
            # gh follows the base branch's queue requirement; --auto also works
            # before rollout. Bind admission to the CI head to reject a push
            # racing the list/read above. Never bypass protection with --admin.
            # Keep squash for pre-queue linear-history compatibility. The queue
            # ruleset owns the method once active. Repository branch cleanup
            # runs only after actual merge, not when admission is requested.
            gh pr merge "$pr" --repo "$REPO" --auto --squash --match-head-commit "$HEAD_SHA"
          done < /tmp/auto-merge-prs.txt
